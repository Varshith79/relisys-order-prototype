<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Relisys Order Portal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Single light look, matching the Relisys design canvas. Phone-width app column, centred on wide screens. */
:root{--bg:#F5F6F8;--surface:#FFFFFF;--ink:#111827;--muted:#4B5563;--faint:#6B7280;--line:#E5E7EB;--line2:#F1F2F4;--brand:#0F4C9A;--brand-soft:#E8EDF4;--warn-bg:#FEF3C7;--warn:#92400E;--ok-bg:#DCFCE7;--ok:#166534;--bad-bg:#FEE2E2;--bad:#991B1B;--hot:#C2410C;--outer:#E9ECF1;color-scheme:light}
html,body{height:100%}
body{background:var(--outer);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
#app{max-width:430px;height:100%;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.hdr{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 16px 12px;display:flex;flex-direction:column;gap:10px;flex-shrink:0}
.hdr-row{display:flex;align-items:center;gap:8px}
.brand{font-size:20px;font-weight:700;letter-spacing:-.02em;color:var(--brand)}
.h1{font-size:20px;font-weight:700}
.h2{font-size:17px;font-weight:700}
.sub{font-size:12px;color:var(--muted)}
.tiny{font-size:11px;color:var(--muted)}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;padding:0}
.iconbtn.plain{border:0;background:transparent}
.badge-dot{position:absolute;top:5px;right:5px;min-width:18px;height:18px;border-radius:9px;background:var(--hot);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.main{flex:1;overflow-y:auto;padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.main>*{flex-shrink:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.pad{padding:14px}
.row{display:flex;align-items:center;gap:12px}
.col{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.b{font-weight:700}.sb{font-weight:600}
.search{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.search input{flex:1;border:0;background:transparent;font-size:15px;outline:none;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px 2px;scrollbar-width:none}
.chip{flex-shrink:0;height:36px;padding:0 13px;border-radius:18px;font-size:13px;font-weight:600;white-space:nowrap;background:var(--surface);border:1px solid #D1D5DB}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.brand.on{background:var(--brand);border-color:var(--brand)}
.prod{display:flex;gap:12px;padding:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.thumb{width:48px;height:48px;border-radius:10px;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sec{display:flex;justify-content:space-between;align-items:baseline;padding-top:4px}
.sec .t{font-size:14px;font-weight:700}
.btn{height:50px;border-radius:14px;border:0;background:var(--brand);color:#fff;font-size:15px;font-weight:600;padding:0 20px;display:flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:var(--surface);color:var(--brand);border:1px solid var(--brand)}
.btn.danger{background:var(--surface);color:#B91C1C;border:1px solid #FCA5A5}
.btn.sm{height:40px;border-radius:10px;font-size:14px;padding:0 14px}
.btn[disabled]{opacity:.45}
.step{display:flex;align-items:center;gap:2px;flex-shrink:0}
.step button{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:19px;padding:0}
.step span{width:30px;text-align:center;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.line{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.line.sel{border:2px solid var(--brand);padding:5px 5px 5px 11px}
.tag{align-self:flex-start;margin-top:3px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--warn-bg);color:var(--warn)}
.pill{font-size:11px;font-weight:700;padding:4px 8px;border-radius:6px;white-space:nowrap}
.p-placed{background:#F3F4F6;color:#374151}.p-proc{background:var(--warn-bg);color:var(--warn)}.p-ship{background:var(--ok-bg);color:var(--ok)}.p-part{background:var(--ok-bg);color:var(--ok)}.p-can{background:var(--bad-bg);color:var(--bad)}.p-closed{background:#F3F4F6;color:#4B5563}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--brand)}
.dias{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.dia{position:relative;height:42px;border-radius:10px;font-size:15px;font-weight:600;background:var(--surface);border:1px solid #D1D5DB}
.dia.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.dia em{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--hot);color:#fff;font-size:11px;font-weight:700;font-style:normal;display:flex;align-items:center;justify-content:center}
.foot{background:var(--surface);border-top:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.nav{height:68px;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:500;color:var(--muted);min-width:72px;padding:6px 0}
.nav button.on{color:var(--brand);font-weight:600}
.cartbar{position:absolute;left:16px;right:16px;bottom:80px;height:54px;border-radius:14px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border:0;font-size:15px;font-weight:600;box-shadow:0 8px 20px rgba(15,76,154,.25);z-index:4}
.toast{position:absolute;left:16px;right:16px;bottom:150px;background:var(--ink);color:#fff;padding:12px 14px;border-radius:12px;font-size:14px;font-weight:600;z-index:9;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;gap:12px}
.tl .dot{width:14px;height:14px;border-radius:7px;background:var(--brand);margin-top:3px;flex-shrink:0}
.tl .dot.todo{background:var(--surface);border:2px solid #D1D5DB}
.tl .ln{width:2px;flex:1;min-height:12px;background:var(--brand);margin:0 auto}
.tl .ln.todo{background:var(--line)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#F3F4F6;border-radius:10px;padding:4px}
.seg button{height:40px;border:0;border-radius:8px;font-size:13px;font-weight:600;background:transparent;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--line2)}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--muted);line-height:1.5}
.field{height:50px;border:1px solid #D1D5DB;border-radius:12px;padding:0 14px;font-size:16px;background:var(--surface);width:100%}
.otp{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.otp input{height:54px;text-align:center;border:1px solid #D1D5DB;border-radius:12px;font-size:22px;font-weight:700;min-width:0;width:100%;background:var(--surface)}
.err{font-size:13px;color:#B91C1C;line-height:1.45}
.menu a,.menu button{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:54px;width:100%;border:0;border-top:1px solid var(--line2);background:transparent;text-align:left;font-size:15px;font-weight:500}
.menu>:first-child{border-top:0}
.notif{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border:0;border-bottom:1px solid var(--line2);background:var(--surface);width:100%;text-align:left}
.notif.unread{background:#EEF4FB}
.ic{width:36px;height:36px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;background:var(--brand-soft);color:var(--brand)}
.ic.news{background:var(--warn-bg);color:var(--warn)}
.toggle{width:48px;height:28px;border-radius:14px;border:0;padding:3px;display:inline-flex;flex-shrink:0;background:#9CA3AF;justify-content:flex-start}
.toggle.on{background:var(--brand);justify-content:flex-end}
.toggle i{width:22px;height:22px;border-radius:11px;background:#fff;display:block}
dl.kv{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:13px}
dl.kv dt{color:var(--muted)}dl.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.shdr{background:#111827;color:#fff;padding:12px 16px;display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.shdr .sub{color:#D1D5DB}
.sbadge{font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;background:#374151;color:#E5E7EB}
.sbtn{height:38px;padding:0 12px;border-radius:10px;border:1px solid #4B5563;background:transparent;color:#fff;font-size:13px;font-weight:600}
.vbar{background:#111827;color:#fff;padding:9px 10px 9px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0;font-size:13px;line-height:1.35}
.vbar button{height:34px;padding:0 14px;border-radius:8px;border:0;background:#fff;color:#111827;font-weight:700;font-size:13px;flex-shrink:0}
.sheet{position:absolute;inset:0;background:rgba(17,24,39,.45);display:flex;flex-direction:column;justify-content:flex-end;z-index:8}
.sheet>div{background:var(--surface);border-radius:20px 20px 0 0;padding:10px 18px 22px;display:flex;flex-direction:column;gap:12px;max-height:86%;overflow-y:auto}
.srow{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:62px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.demo{font-size:11px;font-weight:600;color:var(--warn);background:var(--warn-bg);padding:6px 10px;border-radius:8px;line-height:1.4}
.empty{background:var(--surface);border:1px dashed #D1D5DB;border-radius:14px;padding:24px 16px;text-align:center;color:var(--muted);line-height:1.5}
.loading{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{transform:translateY(8px);opacity:0}}}
</style>

<div id="app"><div class="loading">Loading Relisys data…</div></div>

<script>
(function(){
'use strict';
var D=null, S={}, app=document.getElementById('app');
var I={
  grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  star:'<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>',
  list:'<path d="M9 5H5v16h14V5h-4"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M21.5 20a6.5 6.5 0 0 0-4-6"/>',
  eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  shield:'<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/>',
  lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  back:'<path d="m15 18-6-6 6-6"/>', next:'<path d="m9 18 6-6-6-6"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 4.9.8c0 1.7-2.4 2.2-2.4 3.7M12 17h.01"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
  stent:'<rect x="3" y="9" width="18" height="6" rx="3"/><path d="M7 9l2 6M11 9l2 6M15 9l2 6"/>'
};
function ic(n,sz,col,fill){return '<svg width="'+(sz||22)+'" height="'+(sz||22)+'" viewBox="0 0 24 24" fill="'+(fill||'none')+'" stroke="'+(col||'currentColor')+'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+I[n]+'</svg>';}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fd(s){if(!s)return '';var p=s.split('-');return (+p[2])+' '+MON[+p[1]-1]+' '+p[0];}
function today(){return D.asOf;}
function store(k,v){try{if(v===undefined){var x=localStorage.getItem('rel_'+k);return x?JSON.parse(x):null;}localStorage.setItem('rel_'+k,JSON.stringify(v));}catch(e){return null;}}

// ---------- data prep ----------
var ITEM={}, GROUP={}, SIZE_RE=/^(.*?)\s*(\d+(?:\.\d+)?)\s*[xX×]\s*(\d+(?:\.\d+)?)\s*(?:mm)?\s*$/;
function prep(){
  D.groups.forEach(function(g){
    GROUP[g.id]=g; var ok=0;
    g.items.forEach(function(it){
      var m=SIZE_RE.exec(it[1]), o={code:it[0],name:it[1],g:g.id};
      if(m){o.d=(+m[2]).toFixed(2);o.l=+m[3];ok++;}
      ITEM[it[0]]=o;
    });
    g.sized=g.items.length>0&&ok/g.items.length>=0.8;
    if(g.sized){var dm={};g.items.forEach(function(it){var o=ITEM[it[0]];if(o.d){(dm[o.d]=dm[o.d]||[]).push(o);}});
      g.dias=Object.keys(dm).sort(function(a,b){return a-b;});g.byDia=dm;g.dias.forEach(function(d){dm[d].sort(function(a,b){return a.l-b.l;});});}
  });
}
function iname(code){var o=ITEM[code];if(!o)return code;var g=GROUP[o.g];if(o.d)return g.product+' '+o.d+' × '+o.l+' mm';return o.name;}

// ---------- order status (dates only, no UDF) ----------
function shippedMap(o){var m={};if(!o.app&&!(o.dcs||[]).length){o.lines.forEach(function(l){var s=l[1]-l[2];if(s>0)m[l[0]]=(m[l[0]]||0)+s;});return m;}(o.dcs||[]).forEach(function(dc){(dc[2]||[]).forEach(function(l){m[l[0]]=(m[l[0]]||0)+l[1];});});return m;}
function ostat(o){
  if(o.cancelled||o.can==='Y')return {k:'can',t:'Cancelled'};
  var tot=0,sh=0,m=shippedMap(o);
  o.lines.forEach(function(l){tot+=l[1];sh+=Math.min(l[1],m[l[0]]||0);});
  o._tot=tot;o._sh=sh;
  if(tot>0&&sh>=tot)return {k:'ship',t:'Shipped'};
  if(sh>0)return o.st==='C'?{k:'ship',t:'Shipped'}:{k:'part',t:'Partly shipped'};
  if((o.inv||[]).length&&o.st==='C')return {k:'ship',t:'Shipped'};
  if(o.st==='C')return {k:'closed',t:'Closed'};
  if(o.due&&o.due!==o.d)return {k:'proc',t:'Under process'};
  return {k:'placed',t:'Placed'};
}
function myOrders(){
  var c=S.cust.code, can=S.cancelled||{};
  var list=D.orders.filter(function(o){return o.c===c;}).map(function(o){o.cancelled=!!can[o.n];return o;});
  var app=(S.appOrders||[]).filter(function(o){return o.c===c;}).map(function(o){o.cancelled=!!can[o.n];return o;});
  return app.concat(list).sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:(String(b.n)>String(a.n)?1:-1);});
}
function pendingMap(){var m={};myOrders().forEach(function(o){var s=ostat(o);if(s.k==='can'||s.k==='closed'||s.k==='ship')return;var sh=shippedMap(o);o.lines.forEach(function(l){var open=o.app?l[1]:l[2];if(open>0)m[l[0]]=(m[l[0]]||0)+open;});});return m;}

// ---------- product visibility set by Relisys staff ----------
function hiddenG(code){return S.hide[code||(S.cust&&S.cust.code)]||{};}
function visG(g){return g&&!hiddenG()[g.id];}
function visItem(code){var o=ITEM[code];return !!o&&visG(GROUP[o.g]);}
function visGroups(){return D.groups.filter(visG);}

// ---------- state ----------
function save(){store('state',{cust:S.cust&&S.cust.code,cart:S.cart,ship:S.ship,appOrders:S.appOrders,cancelled:S.cancelled,saved:S.saved,read:S.read,sms:S.sms,staff:S.staff,view:S.view,hide:S.hide,blocked:S.blocked,access:S.access});}
function load(){var x=store('state')||{};S={screen:'login',cart:x.cart||{},ship:x.ship||0,appOrders:x.appOrders||[],cancelled:x.cancelled||{},saved:x.saved||{},read:x.read||{},sms:x.sms!==false,ofilter:'all',otab:'pending',ftab:'freq',ntab:'all',q:'',hdr:{}};
  S.staff=x.staff||null;S.view=x.view||null;S.hide=x.hide||{};S.blocked=x.blocked||{};S.access=x.access||{};S.sf='all';S.vf='all';S.sq='';
  if(x.cust){S.cust=D.customers.find(function(c){return c.code===x.cust;});if(S.cust)S.screen='home';}
  if(S.staff&&!S.view){S.cust=null;S.screen='shome';}}
function go(scr,extra){var keep=S.screen;S.prev=keep;S.screen=scr;if(extra)for(var k in extra)S[k]=extra[k];S.scrollTop=0;render();}
var toastT;function toast(t){S.toast=t;render();clearTimeout(toastT);toastT=setTimeout(function(){S.toast='';render();},2600);}
function cartCount(){var n=0,u=0;for(var k in S.cart){if(S.cart[k]>0){n++;u+=S.cart[k];}}return {n:n,u:u};}
function setQty(code,v){S.cart[code]=Math.max(0,v);if(!S.cart[code])delete S.cart[code];save();render();}

// ---------- shared pieces ----------
function nav(on){var T=[['home','Products','grid'],['freq','Frequent items','star'],['orders','My orders','list'],['account','Account','user']];
  return '<nav class="nav">'+T.map(function(t){return '<button data-go="'+t[0]+'" class="'+(on===t[0]?'on':'')+'"'+(on===t[0]?' aria-current="page"':'')+'>'+ic(t[2])+t[1]+'</button>';}).join('')+'</nav>';}
function backHdr(title,sub,right){return '<header class="hdr" style="padding:8px 12px"><div class="hdr-row"><button class="iconbtn plain" data-act="back" aria-label="Back">'+ic('back')+'</button><div class="col"><span class="h2">'+esc(title)+'</span>'+(sub?'<span class="sub">'+esc(sub)+'</span>':'')+'</div>'+(right||'')+'</div></header>';}
function stepper(code,q,usual){return '<div class="step"><button data-dec="'+esc(code)+'" aria-label="Decrease quantity">−</button><span>'+q+'</span><button data-inc="'+esc(code)+'"'+(usual?' data-usual="'+usual+'"':'')+' aria-label="Increase quantity">+</button></div>';}
function cartBar(){var c=cartCount();if(!c.n||S.view)return '';return '<button class="cartbar" data-go="cart"><span>'+c.n+' sizes · '+c.u+' units in cart</span><span style="display:flex;align-items:center;gap:6px">View cart '+ic('next',18,'#fff')+'</span></button>';}
function pill(s){return '<span class="pill p-'+s.k+'">'+s.t+'</span>';}

// ---------- notifications ----------
function notes(){
  var out=[], c=S.cust;
  myOrders().forEach(function(o){
    var s=ostat(o);

  if(t.id==='su'){S.su=t.value;}
  if(t.id==='sq'){S.sq=t.value;var sl=document.getElementById('slist');if(sl)sl.innerHTML=sList();}
  if(t.dataset.otp&&t.value){var nx=app.querySelector('[data-otp="'+(+t.dataset.otp+1)+'"]');if(nx)nx.focus();}
});
app.addEventListener('change',function(e){if(e.target.id==='ship'){S.ship=+e.target.value;save();}if(e.target.id==='svcust'){S.scust=e.target.value;render();}});
app.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='mob'){e.preventDefault();act('sendotp');}});
function act(a,el){
  if(a==='back'){var map={product:'home',cart:S.prev==='product'?'product':'home',order:'orders',notif:S.prev&&S.prev!=='notif'?S.prev:'home',help:'account'};go(map[S.screen]||'home');return;}
  if(a==='sendotp'){var m=(S.mob||'').slice(-10);if(m.length!==10){S.lerr='Enter your 10-digit mobile number.';render();return;}
    var hits=D.customers.filter(function(c){return String(c.mobile).slice(-10)===m;});
    if(!hits.length){S.lerr='This number isn’t registered with Relisys. Contact your Relisys sales representative to add it.';render();return;}
    if(hits.length>1){S.lerr='This number is on more than one customer in Relisys records. Contact your Relisys sales representative to fix it.';render();return;}
    if(S.blocked[hits[0].code]){S.lerr='Sign-in for this account is turned off by Relisys. Contact your Relisys sales representative.';render();return;}
    S.lerr='';S.lhit=hits[0];S.lstep='otp';render();return;}
  if(a==='verify'){var code=[].map.call(app.querySelectorAll('[data-otp]'),function(i){return i.value;}).join('');if(!/^\d{6}$/.test(code)){S.lerr='Enter all 6 digits.';render();return;}signIn(S.lhit);return;}
  if(a==='chgno'){S.lstep='mobile';S.lerr='';render();return;}
  if(a==='place'){var lines=Object.keys(S.cart).map(function(k){return [k,S.cart[k],S.cart[k]];});var n='APP-'+String(Date.now()).slice(-6);
    S.appOrders.unshift({n:n,c:S.cust.code,d:today(),due:today(),st:'O',can:'N',lines:lines,dcs:[],inv:[],app:true,ship:S.cust.shipTo[+S.ship]});S.cart={};save();S.ofilter='all';go('orders');toast('Order '+n+' placed. Demo: saved on this phone only.');return;}
  if(a==='readall'){notes().forEach(function(n){S.read[n.id]=1;});save();render();return;}
  if(a==='sms'){S.sms=!S.sms;save();render();return;}
  if(a==='addr'){S.allAddr=!S.allAddr;render();return;}
  if(a==='ssignin'){var un=(S.su||'').trim().toLowerCase(),pw=(document.getElementById('sp')||{}).value||'';var u=staffList().find(function(x){return x[0].toLowerCase()===un;});
    if(!un||!pw){S.serr='Enter your SAP username and password.';render();return;}
    if(!u){S.serr='SAP didn’t accept this username or password.';render();return;}
    if(!hasAccess(u)){S.serr='This SAP user doesn’t have access to the staff screens. Ask a Relisys admin to give access.';render();return;}
    staffIn(u[0]);return;}
  if(a==='spick'){var v=document.getElementById('spick').value;staffIn(v);return;}
  if(a==='ssignout'){S.staff=null;S.view=null;S.cust=null;S.sheet=null;S.lstep='mobile';save();go('login');return;}
  if(a==='sclose'){S.sheet=null;render();return;}
  if(a==='sexit'){if(S.view)S.scust=S.view;S.view=null;S.cust=null;S.sheet=null;save();go(S.vfrom==='svis'?'svis':'shome');return;}
  if(a==='sshowall'){S.hide[S.scust]={};save();toast('Saved. This customer sees all products.');return;}
  if(a==='signout'&&S.view){act('sexit');return;}
  if(a==='signout'){S.cust=null;S.cart={};S.lstep='mobile';S.mob='';save();go('login');return;}
}
app.addEventListener('click',function(e){
  if(e.target.closest('[data-stop]')&&!e.target.closest('button'))return;
  var b=e.target.closest('button,[data-go],[data-act]');if(!b||b.disabled)return;var d=b.dataset;
  if(S.view&&(d.inc||d.dec||d.reorder||d.cancel||d.act==='place')){toast('View only. Customers place their own orders.');return;}
  if(d.act)return act(d.act,b);
  if(d.scust){S.sheet=d.scust;render();return;}
  if(d.sview){var vc=D.customers.find(function(x){return x.code===d.sview;});S.vfrom=S.screen;S.view=vc.code;S.cust=vc;S.sheet=null;S.q='';S.gkind='FG';save();go('home');return;}
  if(d.svis){S.scust=d.svis;S.sheet=null;go('svis');return;}
  if(d.sblock){S.blocked[d.sblock]=!S.blocked[d.sblock];save();render();return;}
  if(d.sf){S.sf=d.sf;render();return;}
  if(d.vf){S.vf=d.vf;render();return;}
  if(d.shide){var hm=S.hide[S.scust]=S.hide[S.scust]||{};if(hm[d.shide])delete hm[d.shide];else hm[d.shide]=1;save();render();return;}
  if(d.sacc){if(!staffUser()[3]){toast('Only SAP superusers can change staff access.');return;}S.access[d.sacc]=!S.access[d.sacc];save();render();return;}
  if(d.go){if(d.go==='notif')S.prev=S.screen;go(d.go);return;}
  if(d.inc){var cur=S.cart[d.inc]||0;setQty(d.inc,cur===0&&d.usual?+d.usual:cur+1);return;}
  if(d.dec){setQty(d.dec,(S.cart[d.dec]||0)-1);return;}
  if(d.group){S.gid=d.group;S.dia=null;go('product');return;}
  if(d.dia){S.dia=d.dia;render();return;}
  if(d.gkind){S.gkind=d.gkind;render();return;}
  if(d.of){S.ofilter=d.of;render();return;}
  if(d.order){S.oid=d.order;S.otab='pending';go('order');return;}
  if(d.otab){S.otab=d.otab;render();return;}
  if(d.cancel){S.cancelled[d.cancel]=1;save();render();toast('Order '+d.cancel+' cancelled.');return;}
  if(d.reorder){var o=myOrders().find(function(x){return String(x.n)===String(d.reorder);});o.lines.forEach(function(l){if(ITEM[l[0]])S.cart[l[0]]=(S.cart[l[0]]||0)+l[1];});save();toast(o.lines.length+' sizes added to cart');return;}
  if(d.ft){S.ftab=d.ft;render();return;}
  if(d.star){var sv=S.saved[S.cust.code]=S.saved[S.cust.code]||{};sv[d.star]=!sv[d.star];save();render();return;}
  if(d.nt){S.ntab=d.nt;render();return;}
  if(d.note){S.read[d.note]=1;save();if(d.onote){S.oid=d.onote;S.otab='pending';go('order');}else render();return;}
  if(d.faq!=null){S.faq=S.faq===+d.faq?-1:+d.faq;render();return;}
});

window.relBack=function(){if(S.sheet){S.sheet=null;render();return true;}if(S.screen==='slogin'){go('login');return true;}if(S.screen==='svis'||S.screen==='sstaff'){go('shome');return true;}if(S.screen==='shome')return false;
  if(S.view&&S.screen==='home'){act('sexit');return true;}
  if(['product','cart','order','notif','help'].indexOf(S.screen)>=0){act('back');return true;}if(S.screen!=='home'&&S.cust){go('home');return true;}return false;};
// ---------- prototype page hooks: only active when the app runs inside the two-phone prototype page ----------
var PROTO=window.parent!==window, syncing=false;
var SYNC_KEYS=['screen','prev','gid','dia','gkind','oid','otab','ftab','ntab','ofilter','faq','lstep','mob','lerr','allAddr','q','sq','sf','vf','sheet','scust','serr','su','vfrom'];
function protoSend(){if(!PROTO||syncing||!D||!S)return;var st={};SYNC_KEYS.forEach(function(k){st[k]=S[k]==null?null:S[k];});st.lhit=S.lhit?S.lhit.code:null;st.view=S.view||null;st.staff=S.staff||null;try{window.parent.postMessage({rel:'sync',st:st},'*');}catch(e){}}
function byCode(code){return code?D.customers.find(function(c){return c.code===code;})||null:null;}
function protoJump(scr){
  S.toast='';S.lerr='';
  S.sheet=null;
  if(scr==='login'){S.cust=null;S.staff=null;S.view=null;S.cart={};S.lstep='mobile';S.mob='';S.lhit=null;save();go('login');return;}
  var firstStaff=(staffList().filter(hasAccess)[0]||[])[0]||'manager';
  if(scr==='slogin'){S.cust=null;S.staff=null;S.view=null;S.serr='';save();go('slogin');return;}
  if(STAFF_SCR[scr]){if(!S.staff)S.staff=firstStaff;S.view=null;S.cust=null;save();go(scr);return;}
  if(scr==='view'){if(!S.staff)S.staff=firstStaff;var vc=byCode((D.demoPicks||[])[0])||D.customers[0];S.view=vc.code;S.cust=vc;S.q='';save();go('home');return;}
  if(S.staff||S.view){S.staff=null;S.view=null;S.cust=null;}
  if(!S.cust){S.cust=byCode((D.demoPicks||[])[0])||D.customers[0];save();}
  var mine=myOrders();
  if(scr==='product'&&!(S.gid&&GROUP[S.gid])){var it=mine.length&&ITEM[mine[0].lines[0][0]];var g=it?GROUP[it.g]:D.groups.find(function(x){return x.sized;});S.gid=g?g.id:D.groups[0].id;S.dia=null;}
  if(scr==='product'){S.prev='home';}
  if(scr==='cart'&&!cartCount().n&&mine.length){mine[0].lines.slice(0,3).forEach(function(l){if(ITEM[l[0]])S.cart[l[0]]=l[1];});save();}
  if(scr==='order'){var pick=mine.find(function(o){return ostat(o).k==='part';})||mine.find(function(o){return ostat(o).k==='proc';})||mine[0];if(!pick){go('orders');return;}S.oid=pick.n;S.otab='pending';}
  if(scr==='notif')S.prev='home';
  go(scr);
}
window.addEventListener('message',function(e){var m=e.data;if(!m||!m.rel||!D)return;
  if(m.rel==='sync'){var x=store('state')||{};syncing=true;
    S.cart=x.cart||{};S.ship=x.ship||0;S.appOrders=x.appOrders||[];S.cancelled=x.cancelled||{};S.saved=x.saved||{};S.read=x.read||{};S.sms=x.sms!==false;S.cust=byCode(x.cust);
    S.staff=x.staff||null;S.view=x.view||null;S.hide=x.hide||{};S.blocked=x.blocked||{};S.access=x.access||{};
    SYNC_KEYS.forEach(function(k){S[k]=m.st[k];});S.lhit=byCode(m.st.lhit);S.toast='';render();syncing=false;return;}
  if(m.rel==='jump'){protoJump(m.screen);return;}
  if(m.rel==='reset'){try{localStorage.removeItem('rel_state');}catch(err){}location.reload();}
});
function boot(data){D=data;prep();load();render();}
if(window.RELISYS_DATA)boot(window.RELISYS_DATA);
else fetch('data.json').then(function(r){return r.json();}).then(boot).catch(function(){app.innerHTML='<div class="loading" style="padding:24px;text-align:center">Couldn’t load the Relisys data. Reload the page to try again.</div>';});
})();
</script>
